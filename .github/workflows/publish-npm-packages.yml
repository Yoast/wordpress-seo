name: Publish NPM Packages

on:
  pull_request:
    types: [ closed ]
    branches: [ trunk ]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to read packages list from (e.g. 12345)."
        required: true
        type: number

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish NPM packages
    runs-on: ubuntu-latest
    environment: npm-publish
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'Version increase') && contains(github.event.pull_request.labels.*.name, 'npm-release'))
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    env:
      NODE_AUTH_TOKEN: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      # Ensure npm 11.5.1 or later is installed - this is needed for OIDC support
      - name: Update npm
        run: npm install -g npm@latest

      - name: Extract packages to release from PR body
        id: packages
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BODY=$(gh pr view "${{ inputs.pr_number }}" --repo "${{ github.repository }}" --json body -q .body)
          else
            BODY="$PR_BODY"
          fi

          # Extracts lines of the form "- package-name: version" (scoped or unscoped) from the PR body, up to ## Context.
          PACKAGES=$(echo "$BODY" | awk '/^## Context/{exit} 1' | grep -oP '^- \K(@yoast/)?[a-z0-9][a-z0-9._-]*(?=: *[0-9])' | tr '\n' ' ')
          if [ -z "${PACKAGES// /}" ]; then
            echo "::error::No packages found in PR body before '## Context'."
            exit 1
          fi
          # Publish in dependency order (dependencies first), whatever order the PR body uses.
          read -ra UNSORTED <<< "$PACKAGES"
          PACKAGES=$(node .github/scripts/sort-npm-packages.js "${UNSORTED[@]}")
          # The versions from the PR body, as "name=version" pairs, to check them against each package.json.
          VERSIONS=$(echo "$BODY" | awk '/^## Context/{exit} 1' | grep -oP '^- \K(@yoast/)?[a-z0-9][a-z0-9._-]*: *[0-9][0-9A-Za-z.+-]*' | sed 's/: */=/' | tr '\n' ' ')
          echo "Packages to release: $PACKAGES"
          echo "list=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"

      - name: Publish packages in order
        env:
          PACKAGE_LIST: ${{ steps.packages.outputs.list }}
          VERSION_LIST: ${{ steps.packages.outputs.versions }}
          NODE_AUTH_TOKEN: ''
        run: |
          set -euo pipefail
          if [ -z "${PACKAGE_LIST// /}" ]; then
            echo "::error::PACKAGE_LIST is empty; nothing to publish."
            exit 1
          fi
          # Publishes the current folder, unless this version is already on npm: a re-run after a failure halfway then publishes only the rest.
          publish() {
            if [ "$ALREADY_PUBLISHED" = "true" ]; then
              echo "::notice::Skipping npm publish for $PACKAGE@$VERSION: this version is already on npm."
            else
              npm publish "$@"
            fi
          }
          read -ra PACKAGES <<< "$PACKAGE_LIST"
          for PACKAGE in "${PACKAGES[@]}"; do
            # Find the workspace folder by the package.json name, since folder names do not always match (e.g. yoastseo, @yoast/wordpress-seo).
            PKG_DIR=$(node -e 'const fs = require("fs"); const dir = fs.readdirSync("packages").find(d => { try { return JSON.parse(fs.readFileSync("packages/" + d + "/package.json", "utf8")).name === process.argv[1]; } catch { return false; } }); if (!dir) { process.exit(1); } console.log("packages/" + dir);' "$PACKAGE") || {
              echo "::error::No folder under packages/ has a package.json named $PACKAGE"
              exit 1
            }

            VERSION=$(node -p "require('./$PKG_DIR/package.json').version")
            EXPECTED=$(tr ' ' '\n' <<< "$VERSION_LIST" | awk -F= -v p="$PACKAGE" '$1 == p { print $2; exit }')
            if [ "$EXPECTED" != "$VERSION" ]; then
              echo "::error::The PR body lists $PACKAGE $EXPECTED, but $PKG_DIR/package.json has version $VERSION."
              exit 1
            fi
            ALREADY_PUBLISHED=false
            if [ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
              ALREADY_PUBLISHED=true
            fi

            echo "::group::Publishing $PACKAGE"

            pushd "$PKG_DIR"

            if node -e "process.exit(require('./package.json').scripts?.prepublishOnly ? 0 : 1)" 2>/dev/null; then
              # Older packages: run prepublishOnly, then publish from dist/ if it exists.
              echo "Strategy: prepublishOnly"
              npm run-script prepublishOnly
              if [ -d "dist" ]; then
                pushd dist
                publish --provenance --access public --ignore-scripts
                popd
              else
                publish --provenance --access public --ignore-scripts
              fi

            elif node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)" 2>/dev/null; then
              # Packages with a build step: build first, then publish.
              echo "Strategy: build"
              NODE_ENV=production npm run-script build
              publish --provenance --access public

            else
              # No build step needed (e.g. config-only packages like tailwindcss-preset).
              echo "Strategy: direct publish"
              publish --provenance --access public
            fi

            popd
            echo "::endgroup::"
          done
